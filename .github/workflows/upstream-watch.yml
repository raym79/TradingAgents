name: Upstream watch

on:
  schedule:
    - cron: '23 16 * * 1' # Monday, 16:23 UTC; GitHub may delay scheduled runs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - name: Compare baseline with upstream
        run: python scripts/upstream_status.py --fetch

