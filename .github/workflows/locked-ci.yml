name: Locked CI

on:
  push:
    branches: [main, 'local/main', 'update/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: locked-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: locked (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      TRADINGAGENTS_NO_UPDATE_CHECK: '1'
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - name: Install pinned package manager
        run: python -m pip install uv==0.9.5
      - name: Install locked wheel and development dependencies
        run: uv sync --locked --extra dev --no-editable
      - name: Check dependencies
        run: uv pip check
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Offline tests
        run: uv run --no-sync pytest -q
      - name: CLI smoke check
        run: uv run --no-sync tradingagents --help

